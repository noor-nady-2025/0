<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>دعوة من قلبك | منصة الطالب</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'media',
            theme: {
                extend: {
                    colors: {
                        'ios-blue': '#0A84FF', 'ios-green': '#30D158',
                        'ios-red': '#FF453A', 'ios-purple': '#BF5AF2',
                        'ios-orange': '#FF9F0A'
                    },
                    boxShadow: {
                        'ios-sm': '0 2px 10px rgba(0,0,0,0.03)',
                        'ios': '0 10px 30px rgba(0,0,0,0.06)',
                        'ios-lg': '0 20px 40px rgba(0,0,0,0.1)',
                        'dynamic-island': '0 16px 32px rgba(0,0,0,0.25)',
                    },
                    animation: {
                        'slide-up': 'slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'fade-in': 'fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'scale-in': 'scaleIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'dynamic-pop': 'dynamicPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards',
                    },
                    keyframes: {
                        slideUp: { '0%': { transform: 'translateY(30px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        scaleIn: { '0%': { transform: 'scale(0.95)', opacity: '0' }, '100%': { transform: 'scale(1)', opacity: '1' } },
                        dynamicPop: { '0%': { transform: 'scale(0.8)', opacity: '0' }, '50%': { transform: 'scale(1.05)' }, '100%': { transform: 'scale(1)', opacity: '1' } },
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap');

        :root {
            --bg-color: #F2F2F7;
            --card-bg: #FFFFFF;
            --text-main: #1C1C1E;
            --text-muted: #8E8E93;
            --border-color: rgba(0,0,0,0.05);
            --glass-bg: rgba(255, 255, 255, 0.75);
            --input-bg: rgba(142, 142, 147, 0.1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #000000;
                --card-bg: #1C1C1E;
                --text-main: #FFFFFF;
                --text-muted: #98989D;
                --border-color: rgba(255,255,255,0.1);
                --glass-bg: rgba(28, 28, 30, 0.75);
                --input-bg: rgba(118, 118, 128, 0.24);
            }
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Tajawal', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            -webkit-tap-highlight-color: transparent;
            scroll-behavior: smooth;
        }

        .text-ios-text { color: var(--text-main); }
        .text-ios-gray { color: var(--text-muted); }
        
        .ios-glass {
            background: var(--glass-bg);
            backdrop-filter: blur(40px) saturate(200%);
            -webkit-backdrop-filter: blur(40px) saturate(200%);
            border-bottom: 1px solid var(--border-color);
        }

        .ios-card {
            background: var(--card-bg);
            border-radius: 32px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.04), 0 1px 4px rgba(0,0,0,0.02);
            border: 1px solid var(--border-color);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease;
        }

        .ios-input {
            background: var(--input-bg);
            border: 1.5px solid transparent;
            border-radius: 20px;
            padding: 16px 20px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            width: 100%;
            outline: none;
            color: var(--text-main);
            font-weight: 500;
        }

        .ios-input:focus {
            background: var(--card-bg);
            border-color: #0A84FF;
            box-shadow: 0 0 0 4px rgba(10, 132, 255, 0.15);
        }

        .ios-btn {
            border-radius: 24px;
            font-weight: 700;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ios-btn:active:not(:disabled) { transform: scale(0.96); opacity: 0.9; }

        .ios-option {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 24px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            color: var(--text-main);
        }

        .ios-option:hover:not(:disabled) {
            border-color: #0A84FF;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(10, 132, 255, 0.1);
        }

        .ios-option.correct { border-color: #30D158; background: rgba(48, 209, 88, 0.05); }
        .ios-option.wrong { border-color: #FF453A; background: rgba(255, 69, 58, 0.05); }

        .dynamic-island {
            background: #000000;
            border-radius: 40px;
            color: #FFFFFF;
            box-shadow: 0 16px 32px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
        }
        @media (prefers-color-scheme: dark) {
            .dynamic-island { background: #FFFFFF; color: #000000; border: 1px solid rgba(0,0,0,0.1); }
        }

        /* Staggered Animations for options */
        .stagger-1 { animation-delay: 0.1s; opacity: 0; }
        .stagger-2 { animation-delay: 0.2s; opacity: 0; }
        .stagger-3 { animation-delay: 0.3s; opacity: 0; }
        .stagger-4 { animation-delay: 0.4s; opacity: 0; }

        .hidden-view { display: none !important; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(142, 142, 147, 0.3); border-radius: 10px; }
    </style>

    <script>
        window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }, startup: { pageReady: () => MathJax.startup.defaultPageReady() } };
        document.addEventListener("DOMContentLoaded", () => { let mjTimeout = null; const observer = new MutationObserver(() => { clearTimeout(mjTimeout); mjTimeout = setTimeout(() => { if (window.MathJax && window.MathJax.typesetPromise) { MathJax.typesetPromise().catch(() => {}); } }, 100); }); const mainEl = document.querySelector('main') || document.body; observer.observe(mainEl, { childList: true, subtree: true, characterData: true }); });
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>

<body class="antialiased selection:bg-ios-blue selection:text-white flex flex-col items-center">

    <div id="toast" class="fixed top-6 left-1/2 -translate-x-1/2 z-[100] transform -translate-y-24 opacity-0 transition-all duration-500 cubic-bezier(0.34, 1.56, 0.64, 1) flex items-center gap-3 px-6 py-3.5 dynamic-island pointer-events-none">
        <ion-icon id="toast-icon" name="information-circle" class="text-2xl"></ion-icon>
        <span id="toast-msg" class="font-bold text-sm tracking-wide"></span>
    </div>

    <div id="global-header" class="fixed top-0 left-0 right-0 z-50 ios-glass flex flex-col items-center pb-4 hidden-view transition-opacity duration-300 pt-safe">
        
        <div id="quran-ticker-wrapper" class="w-[92%] sm:max-w-md md:max-w-xl mt-4 flex items-center justify-center">
            <div class="dynamic-island py-2.5 px-6 flex items-center justify-between gap-4 w-full transition-all duration-500 cursor-default">
                <ion-icon name="leaf" class="opacity-80 text-xl sm:text-2xl flex-shrink-0 text-ios-green"></ion-icon>
                <div id="quran-ticker" class="transition-opacity duration-500 flex-1 text-center z-10 text-sm sm:text-base md:text-lg font-bold leading-relaxed tracking-wide">
                    جاري تحميل الآيات...
                </div>
                <ion-icon name="moon" class="opacity-80 text-xl sm:text-2xl flex-shrink-0 text-ios-blue"></ion-icon>
            </div>
        </div>

        <div class="w-full max-w-5xl px-4 sm:px-6 mt-4 sm:mt-5 flex justify-between items-center relative">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 sm:w-12 sm:h-12 bg-ios-blue text-white rounded-2xl flex items-center justify-center shadow-lg shrink-0">
                    <ion-icon name="book" class="text-xl sm:text-2xl"></ion-icon>
                </div>
                <div class="min-w-0">
                    <h1 class="text-lg sm:text-xl font-bold text-ios-text leading-none truncate tracking-tight">دعوة من قلبك</h1>
                    <p id="user-role-badge" class="text-[10px] sm:text-xs text-ios-gray font-medium mt-1.5 truncate"></p>
                </div>
            </div>

            <div class="flex items-center gap-2 sm:gap-3">
                <button id="btn-notifications" onclick="ui.toggleNotifications()" class="hidden relative text-ios-gray hover:text-ios-blue bg-white/50 dark:bg-black/50 backdrop-blur-md p-2.5 sm:p-3 rounded-full transition-all shrink-0 border border-[var(--border-color)]">
                    <ion-icon name="notifications" class="text-xl"></ion-icon>
                    <span id="notif-badge" class="absolute top-1 right-1 w-2.5 h-2.5 sm:w-3 sm:h-3 bg-ios-red rounded-full border-2 border-[var(--card-bg)] hidden animate-pulse"></span>
                </button>
                <button onclick="app.logout()" class="text-ios-red bg-red-500/10 hover:bg-red-500/20 p-2.5 sm:p-3 rounded-full transition-all shrink-0">
                    <ion-icon name="log-out" class="text-xl"></ion-icon>
                </button>
            </div>
        </div>
    </div>

    <main class="w-full max-w-5xl px-4 sm:px-6 min-h-screen pb-24 relative">

        <div id="view-student-login" class="min-h-screen flex flex-col items-center justify-center animate-fade-in hidden-view">
            <div class="w-full max-w-md">
                <div class="ios-card p-8 sm:p-10 animate-scale-in relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-full h-32 bg-gradient-to-b from-blue-500/10 to-transparent dark:from-blue-500/5 -z-10"></div>
                    <div class="text-center mb-8 sm:mb-10">
                        <div class="w-20 h-20 sm:w-24 sm:h-24 bg-gradient-to-br from-ios-blue to-blue-400 text-white rounded-3xl sm:rounded-[32px] flex items-center justify-center shadow-ios-lg mb-6 mx-auto transform rotate-3 hover:rotate-0 transition-transform duration-500">
                            <ion-icon name="planet" class="text-4xl sm:text-5xl"></ion-icon>
                        </div>
                        <h2 class="text-2xl sm:text-3xl font-extrabold text-ios-text tracking-tight">دعوة من قلبك</h2>
                        <p class="text-ios-gray text-xs sm:text-sm mt-3 font-medium">المنصة الذكية للتقييم</p>
                    </div>

                    <form id="student-login-form" onsubmit="app.studentLogin(event)">
                        <div class="mb-6 sm:mb-8">
                            <input type="text" id="student-name" required placeholder="الاسم الرباعي" class="ios-input w-full text-base sm:text-lg text-center" minlength="3">
                        </div>
                        <button type="submit" class="ios-btn w-full bg-ios-text text-[var(--bg-color)] py-4 sm:py-5 text-base sm:text-lg shadow-lg hover:shadow-xl group">
                            متابعة <ion-icon name="arrow-back" class="ml-2 group-hover:-translate-x-1 transition-transform"></ion-icon>
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <div id="view-student-dashboard" class="hidden-view mt-36 sm:mt-44 animate-fade-in">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-8 sm:mb-10 gap-4 sm:gap-6">
                <div>
                    <h2 class="text-2xl sm:text-3xl md:text-4xl font-extrabold text-ios-text mb-2 tracking-tight">الامتحانات المتاحة</h2>
                    <p class="text-ios-gray font-medium text-sm sm:text-lg">اختر التحدي المناسب لك</p>
                </div>

                <div class="w-full md:w-80 relative">
                    <ion-icon name="search" class="absolute right-4 top-1/2 -translate-y-1/2 text-ios-gray text-lg sm:text-xl"></ion-icon>
                    <input type="text" id="search-exam" oninput="app.filterExams()" placeholder="ابحث عن امتحان..." class="ios-input w-full pr-12 bg-[var(--card-bg)] shadow-sm text-sm sm:text-base">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 sm:gap-5 mb-8 sm:mb-10">
                <div class="ios-card p-4 sm:p-6 flex items-center gap-3 sm:gap-5 hover:-translate-y-1 transition-transform">
                    <div class="w-10 h-10 sm:w-14 sm:h-14 bg-green-500/10 text-ios-green rounded-xl sm:rounded-2xl flex items-center justify-center text-xl sm:text-2xl shrink-0">
                        <ion-icon name="checkmark-done"></ion-icon>
                    </div>
                    <div>
                        <p class="text-xs sm:text-sm text-ios-gray font-bold mb-0.5 sm:mb-1">مكتمل</p>
                        <p class="text-xl sm:text-3xl font-black text-ios-text" id="stat-completed-exams">0</p>
                    </div>
                </div>
                <div class="ios-card p-4 sm:p-6 flex items-center gap-3 sm:gap-5 hover:-translate-y-1 transition-transform">
                    <div class="w-10 h-10 sm:w-14 sm:h-14 bg-purple-500/10 text-ios-purple rounded-xl sm:rounded-2xl flex items-center justify-center text-xl sm:text-2xl shrink-0">
                        <ion-icon name="trending-up"></ion-icon>
                    </div>
                    <div>
                        <p class="text-xs sm:text-sm text-ios-gray font-bold mb-0.5 sm:mb-1">المتوسط</p>
                        <p class="text-xl sm:text-3xl font-black text-ios-text" id="stat-average-score">0%</p>
                    </div>
                </div>
            </div>

            <div id="exams-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-8">
            </div>
        </div>

        <div id="view-exam-player" class="hidden-view mt-32 sm:mt-40 animate-fade-in max-w-3xl mx-auto">
            <div class="flex justify-between items-center mb-6 sm:mb-8 px-1 sm:px-2">
                <button onclick="app.exitExam()" class="text-ios-text flex items-center gap-1.5 sm:gap-2 text-sm sm:text-base font-bold bg-[var(--card-bg)] px-4 sm:px-5 py-2 sm:py-2.5 rounded-full shadow-sm border border-[var(--border-color)] hover:bg-red-500/10 hover:text-ios-red transition-colors">
                    <ion-icon name="close-circle" class="text-lg sm:text-xl"></ion-icon> خروج
                </button>
                <div id="timer-display" class="hidden text-ios-text font-mono font-bold text-sm sm:text-base bg-[var(--card-bg)] px-4 sm:px-5 py-2 sm:py-2.5 rounded-full shadow-sm border border-[var(--border-color)] flex items-center gap-2">
                    <ion-icon name="time" class="text-lg sm:text-xl text-ios-orange"></ion-icon> <span id="time-left">00:00</span>
                </div>
            </div>

            <div id="question-anim-container" class="ios-card p-5 sm:p-8 md:p-12 mb-6 sm:mb-8">
                <div class="flex justify-between items-center mb-6 sm:mb-8">
                    <div class="text-ios-text text-xs sm:text-sm font-bold bg-gray-500/10 px-4 py-1.5 sm:py-2 rounded-full flex items-center gap-1.5 sm:gap-2">
                        <ion-icon name="flag" class="text-ios-blue"></ion-icon> <span id="player-progress-text">السؤال 1 من 10</span>
                    </div>
                </div>
                <div class="w-full bg-[var(--input-bg)] rounded-full h-2 sm:h-3 mb-8 sm:mb-10 overflow-hidden">
                    <div id="player-progress-bar" class="bg-ios-blue h-full rounded-full transition-all duration-700 ease-out relative" style="width: 10%"></div>
                </div>

                <h3 id="question-text" class="text-xl sm:text-2xl md:text-3xl font-extrabold mb-8 sm:mb-12 leading-[1.8] text-ios-text text-center px-1 sm:px-2"></h3>

                <div id="options-container" class="space-y-3 sm:space-y-4 px-0 sm:px-1"></div>

                <div id="essay-container" class="hidden mt-6 sm:mt-8">
                    <textarea id="essay-answer" rows="5" class="ios-input w-full resize-none text-base sm:text-lg leading-relaxed bg-[var(--card-bg)] border border-[var(--border-color)]" placeholder="اكتب إجابتك هنا بوضوح..."></textarea>
                    <button id="essay-submit-btn" onclick="app.submitEssay()" class="ios-btn w-full bg-ios-blue text-white py-4 sm:py-5 mt-4 sm:mt-6 text-base sm:text-xl shadow-lg shadow-blue-500/30">حفظ الإجابة</button>
                </div>

                <div id="feedback-container" class="hidden mt-6 sm:mt-8 animate-slide-up">
                    <div id="feedback-card" class="ios-card border-2 p-5 sm:p-8 flex flex-col sm:flex-row items-start gap-4 sm:gap-5">
                        <div id="feedback-icon" class="text-4xl sm:text-5xl shrink-0 self-center sm:self-start"></div>
                        <div class="flex-1 text-center sm:text-right w-full">
                            <h4 id="feedback-title" class="text-lg sm:text-2xl font-black mb-2 sm:mb-3 tracking-tight"></h4>
                            <div id="feedback-desc" class="text-ios-gray leading-relaxed text-sm sm:text-lg font-medium"></div>
                            <div id="feedback-options-analysis" class="mt-4 sm:mt-6 space-y-2 sm:space-y-3 hidden text-right"></div>
                        </div>
                    </div>
                </div>

                <div class="flex flex-row justify-between items-center gap-3 sm:gap-4 mt-8 sm:mt-10 pt-5 sm:pt-6 border-t border-[var(--border-color)]">
                    <button id="btn-prev" onclick="app.prevQuestion()" class="ios-btn bg-[var(--input-bg)] text-ios-text py-3.5 sm:py-4 px-4 sm:px-8 text-sm sm:text-lg hover:bg-gray-200/50 flex-1 sm:flex-none gap-1.5 sm:gap-2 transition-all disabled:opacity-50 disabled:cursor-not-allowed">
                        <ion-icon name="arrow-forward"></ion-icon> السابق
                    </button>
                    <button id="btn-next" onclick="app.nextQuestion()" class="ios-btn bg-ios-blue text-white py-3.5 sm:py-4 px-4 sm:px-12 text-sm sm:text-lg shadow-lg shadow-blue-500/30 flex-1 sm:flex-none gap-1.5 sm:gap-2 transition-all hover:scale-[0.98]">
                        التالي <ion-icon name="arrow-back"></ion-icon>
                    </button>
                </div>

            </div>
        </div>

        <div id="view-exam-results" class="hidden-view mt-24 sm:mt-32 flex flex-col items-center justify-center animate-scale-in">
            <div class="ios-card w-full max-w-lg p-8 sm:p-12 text-center overflow-hidden relative border-0 shadow-ios-lg">
                <div class="absolute inset-0 bg-gradient-to-b from-blue-500/10 to-transparent pointer-events-none"></div>
                <div class="w-24 h-24 sm:w-32 sm:h-32 mx-auto bg-gradient-to-br from-ios-blue to-ios-purple rounded-[32px] sm:rounded-[40px] flex items-center justify-center text-white text-5xl sm:text-6xl shadow-2xl mb-6 sm:mb-8 transform -rotate-3">
                    <ion-icon name="trophy"></ion-icon>
                </div>
                <h2 class="text-2xl sm:text-4xl font-black text-ios-text mb-2 sm:mb-3 tracking-tight">اكتمل التحدي!</h2>
                <p id="result-message" class="text-ios-gray mb-8 sm:mb-10 font-bold text-sm sm:text-lg">أداء رائع، استمر في التقدم.</p>

                <div class="bg-[var(--bg-color)] rounded-[24px] sm:rounded-[32px] p-6 sm:p-8 mb-8 sm:mb-10">
                    <div class="text-5xl sm:text-7xl font-black text-ios-text mb-1 sm:mb-2 tracking-tighter" id="result-score">80%</div>
                    <p class="text-xs sm:text-sm text-ios-gray font-bold uppercase tracking-widest">النتيجة النهائية</p>
                </div>

                <div class="grid grid-cols-2 gap-4 sm:gap-5 mb-8 sm:mb-10 text-right">
                    <div class="bg-green-500/10 p-4 sm:p-5 rounded-2xl sm:rounded-3xl flex flex-col items-center justify-center">
                        <span class="text-3xl sm:text-4xl text-ios-green font-black mb-1 sm:mb-2" id="result-correct">8</span>
                        <span class="text-xs sm:text-sm text-ios-green font-bold">إجابة صحيحة</span>
                    </div>
                    <div class="bg-red-500/10 p-4 sm:p-5 rounded-2xl sm:rounded-3xl flex flex-col items-center justify-center">
                        <span class="text-3xl sm:text-4xl text-ios-red font-black mb-1 sm:mb-2" id="result-wrong">2</span>
                        <span class="text-xs sm:text-sm text-ios-red font-bold">إجابة خاطئة/متروكة</span>
                    </div>
                </div>
                <button onclick="ui.switchView('view-student-dashboard')" class="ios-btn w-full bg-ios-text text-[var(--bg-color)] py-4 sm:py-5 text-lg sm:text-xl shadow-lg">العودة للرئيسية</button>
            </div>
        </div>
    </main>

    <div id="student-notif-sheet" class="fixed inset-0 z-[150] hidden">
        <div id="notif-backdrop" class="absolute inset-0 bg-black/50 backdrop-blur-md opacity-0 transition-opacity duration-400" onclick="ui.closeNotifications()"></div>
        <div id="notif-sheet-content" class="absolute bottom-0 left-0 right-0 bg-[var(--card-bg)] rounded-t-[32px] sm:rounded-t-[40px] shadow-2xl h-[85vh] flex flex-col transform translate-y-full transition-transform duration-500 cubic-bezier(0.32, 0.72, 0, 1)">
            <div class="w-full flex justify-center pt-4 pb-2" onclick="ui.closeNotifications()">
                <div class="w-12 sm:w-16 h-1.5 bg-gray-300 dark:bg-gray-600 rounded-full"></div>
            </div>
            <div class="px-6 sm:px-8 py-4 sm:py-5 flex justify-between items-center">
                <h3 class="text-2xl sm:text-3xl font-extrabold flex items-center gap-3 text-ios-text tracking-tight">
                    <div class="w-8 h-8 sm:w-10 sm:h-10 bg-ios-blue text-white rounded-full flex items-center justify-center text-lg sm:text-xl"><ion-icon name="notifications"></ion-icon></div> الإشعارات
                </h3>
                <button onclick="ui.closeNotifications()" class="w-8 h-8 sm:w-10 sm:h-10 bg-[var(--input-bg)] text-ios-text rounded-full flex items-center justify-center text-lg sm:text-xl font-bold">
                    <ion-icon name="close"></ion-icon>
                </button>
            </div>
            <div class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-4 sm:space-y-5" id="notif-list"></div>
        </div>
    </div>

    <div id="modal-custom-confirm" class="fixed inset-0 bg-black/40 backdrop-blur-lg z-[200] hidden flex items-center justify-center p-6 opacity-0 transition-opacity duration-300">
        <div class="bg-[var(--card-bg)] rounded-[32px] w-full max-w-sm p-6 sm:p-8 text-center shadow-dynamic-island transform scale-95 transition-transform duration-300 border border-[var(--border-color)]" id="modal-confirm-content">
            <div class="w-16 h-16 sm:w-20 sm:h-20 bg-red-500/10 text-ios-red rounded-full flex items-center justify-center mx-auto mb-5 sm:mb-6">
                <ion-icon name="warning" class="text-3xl sm:text-4xl"></ion-icon>
            </div>
            <h3 class="text-xl sm:text-2xl font-bold mb-2 sm:mb-3 text-ios-text tracking-tight" id="confirm-title">تأكيد</h3>
            <p class="text-ios-gray mb-6 sm:mb-8 text-sm sm:text-base font-medium" id="confirm-msg">هل أنت متأكد؟</p>
            <div class="flex gap-3 sm:gap-4">
                <button id="confirm-cancel-btn" class="ios-btn flex-1 bg-[var(--input-bg)] text-ios-text py-3 sm:py-4 rounded-2xl font-bold text-base sm:text-lg">إلغاء</button>
                <button id="confirm-ok-btn" class="ios-btn flex-1 bg-ios-red text-white py-3 sm:py-4 rounded-2xl font-bold text-base sm:text-lg shadow-lg shadow-red-500/30">متأكد</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, setDoc, doc, query, where, onSnapshot, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyC950hfJVJYQou-LtcDrlv8fdo2GpEZEu0", authDomain: "noor-9025f.firebaseapp.com", projectId: "noor-9025f", storageBucket: "noor-9025f.firebasestorage.app", messagingSenderId: "300430539406", appId: "1:300430539406:web:74c3e99f988aaa2c5e27df", measurementId: "G-2WCS5YWGXG" };
        const firebaseApp = initializeApp(firebaseConfig);
        const db = initializeFirestore(firebaseApp, { localCache: persistentLocalCache({tabManager: persistentMultipleTabManager()}) });

        window.appState = { user: null, exams: [], notifications: [], currentExam: null, playerState: { questionIndex: 0, score: 0, correct: 0, wrong: 0, timer: null, seconds: 0, answers: {} }, studentStats: { totalCompleted: 0, averageScore: 0, completedIds: [] }, lastSeenNotifId: localStorage.getItem('lastSeenNotifId') || null, unsubscribeNotifs: null, unsubscribeExams: null, searchTimeout: null };

        const quranVerses = ["وَقَالَ رَبُّكُمُ ادْعُونِي أَسْتَجِبْ لَكُمْ ۝", "لَا تَحْزَنْ إِنَّ اللَّهَ مَعَنَا ۝", "فَإِنَّ مَعَ الْعُسْرِ يُسْرًا ۝", "وَمَن يَتَّقِ اللَّهَ يَجْعَل لَّهُ مَخْرَجًا ۝", "وَاصْبِرْ لِحُكْمِ رَبِّكَ فَإِنَّكَ بِأَعْيُنِنَا ۝"];

        window.ui = {
            switchView: (viewId) => {
                document.querySelectorAll('main > div').forEach(el => el.classList.add('hidden-view'));
                const view = document.getElementById(viewId);
                if (view) { view.classList.remove('hidden-view'); view.style.animation = 'none'; view.offsetHeight; view.style.animation = null; }
                const header = document.getElementById('global-header'); const notifBtn = document.getElementById('btn-notifications');
                if (['view-student-dashboard', 'view-exam-player', 'view-exam-results'].includes(viewId)) {
                    header.classList.remove('hidden-view'); document.getElementById('user-role-badge').innerText = appState.user ? `الطالب: ${appState.user.name}` : '';
                    if (appState.user) notifBtn.classList.remove('hidden');
                } else { header.classList.add('hidden-view'); notifBtn.classList.add('hidden'); }
            },
            showToast: (msg, type = 'info') => {
                const toast = document.getElementById('toast'); const icon = document.getElementById('toast-icon');
                document.getElementById('toast-msg').innerText = msg;
                if (type === 'error') { icon.setAttribute('name', 'alert-circle'); icon.className='text-xl sm:text-2xl text-ios-red'; }
                else if (type === 'success') { icon.setAttribute('name', 'checkmark-circle'); icon.className='text-xl sm:text-2xl text-ios-green'; }
                else { icon.setAttribute('name', 'information-circle'); icon.className='text-xl sm:text-2xl text-ios-blue'; }
                toast.classList.remove('-translate-y-24', 'opacity-0');
                setTimeout(() => { toast.classList.add('-translate-y-24', 'opacity-0'); }, 3000);
            },
            playSound: (type) => { /* logic stays same */ },
            startQuranTicker: () => {
                const ticker = document.getElementById('quran-ticker'); let idx = 0;
                const updateVerse = () => { ticker.style.opacity = 0; setTimeout(() => { idx = (idx + 1) % quranVerses.length; ticker.innerText = quranVerses[idx]; ticker.style.opacity = 1; }, 500); };
                updateVerse(); setInterval(updateVerse, 30000); // تم التعديل هنا إلى 30 ثانية
            },
            confirm: (title, msg, onConfirmCallback) => {
                const modal = document.getElementById('modal-custom-confirm');
                document.getElementById('confirm-title').innerText = title; document.getElementById('confirm-msg').innerText = msg;
                modal.classList.remove('hidden'); setTimeout(() => { modal.classList.remove('opacity-0'); document.getElementById('modal-confirm-content').classList.remove('scale-95'); }, 10);
                const close = () => { modal.classList.add('opacity-0'); document.getElementById('modal-confirm-content').classList.add('scale-95'); setTimeout(() => modal.classList.add('hidden'), 300); };
                document.getElementById('confirm-cancel-btn').onclick = close; document.getElementById('confirm-ok-btn').onclick = () => { close(); onConfirmCallback(); };
            },
            toggleNotifications: () => { const sheet = document.getElementById('student-notif-sheet'); if (sheet.classList.contains('hidden')) ui.openNotifications(); else ui.closeNotifications(); },
            openNotifications: () => {
                const sheet = document.getElementById('student-notif-sheet'); const backdrop = document.getElementById('notif-backdrop'); const content = document.getElementById('notif-sheet-content');
                sheet.classList.remove('hidden'); document.getElementById('notif-badge').classList.add('hidden');
                if (appState.notifications.length > 0) { appState.lastSeenNotifId = appState.notifications[0].id; localStorage.setItem('lastSeenNotifId', appState.lastSeenNotifId); }
                app.renderNotificationsList();
                setTimeout(() => { backdrop.classList.remove('opacity-0'); content.classList.remove('translate-y-full'); }, 10);
            },
            closeNotifications: () => {
                const sheet = document.getElementById('student-notif-sheet'); const backdrop = document.getElementById('notif-backdrop'); const content = document.getElementById('notif-sheet-content');
                backdrop.classList.add('opacity-0'); content.classList.add('translate-y-full'); setTimeout(() => { sheet.classList.add('hidden'); }, 400);
            },
            renderSkeletonLoader: () => {
                return Array(6).fill(`<div class="ios-card p-0 overflow-hidden animate-pulse"><div class="h-32 sm:h-40 w-full bg-[var(--input-bg)]"></div><div class="p-5 sm:p-6"><div class="h-5 sm:h-6 bg-[var(--input-bg)] rounded-full w-3/4 mb-3 sm:mb-4"></div><div class="h-3 sm:h-4 bg-[var(--input-bg)] rounded-full w-full mb-2 sm:mb-3"></div><div class="h-3 sm:h-4 bg-[var(--input-bg)] rounded-full w-5/6 mb-4 sm:mb-6"></div><div class="h-12 sm:h-14 bg-[var(--input-bg)] rounded-xl sm:rounded-2xl w-full"></div></div></div>`).join('');
            }
        };

        window.app = {
            init: () => {
                ui.startQuranTicker();
                try {
                    const savedUser = localStorage.getItem('noor_user');
                    if (savedUser) { appState.user = JSON.parse(savedUser); ui.switchView('view-student-dashboard'); document.getElementById('exams-container').innerHTML = ui.renderSkeletonLoader(); app.listenForNotifications(); app.loadExams(); }
                    else { ui.switchView('view-student-login'); }
                } catch(e) { localStorage.removeItem('noor_user'); ui.switchView('view-student-login'); }
            },
            studentLogin: (e) => {
                e.preventDefault(); const name = document.getElementById('student-name').value.trim();
                if (name.length < 3) { ui.showToast('يرجى إدخال اسم صحيح', 'error'); return; }
                let uid = 'stu_' + Date.now() + Math.random().toString(36).substr(2, 5);
                try { const oldUserStr = localStorage.getItem('noor_user'); if (oldUserStr) { const oldUser = JSON.parse(oldUserStr); if (oldUser.name === name) uid = oldUser.uid; } } catch(err){}
                appState.user = { role: 'student', name, uid }; localStorage.setItem('noor_user', JSON.stringify(appState.user));
                ui.showToast('أهلاً بك يا ' + name.split(' ')[0], 'success');
                ui.switchView('view-student-dashboard'); document.getElementById('exams-container').innerHTML = ui.renderSkeletonLoader();
                app.listenForNotifications(); app.loadExams();
            },
            logout: () => { if (appState.unsubscribeNotifs) { appState.unsubscribeNotifs(); appState.unsubscribeNotifs = null; } if (appState.unsubscribeExams) { appState.unsubscribeExams(); appState.unsubscribeExams = null; } localStorage.removeItem('noor_user'); appState.user = null; appState.studentStats = { totalCompleted: 0, averageScore: 0, completedIds: [] }; ui.switchView('view-student-login'); },
            listenForNotifications: () => {
                if (appState.unsubscribeNotifs) appState.unsubscribeNotifs();
                const q = query(collection(db, "notifications"), orderBy("createdAt", "desc"));
                appState.unsubscribeNotifs = onSnapshot(q, (snapshot) => {
                    const newNotifs = []; snapshot.forEach((doc) => newNotifs.push(doc.data())); appState.notifications = newNotifs;
                    if (newNotifs.length > 0 && newNotifs[0].id !== appState.lastSeenNotifId) { document.getElementById('notif-badge').classList.remove('hidden'); }
                    if (!document.getElementById('student-notif-sheet').classList.contains('hidden')) app.renderNotificationsList();
                });
            },
            loadExams: async () => {
                await app.loadStudentStats();
                if (appState.unsubscribeExams) appState.unsubscribeExams();
                const q = query(collection(db, "exams"), orderBy("createdAt", "desc"));
                appState.unsubscribeExams = onSnapshot(q, { includeMetadataChanges: true }, (snapshot) => {
                    let fetchedExams = []; snapshot.forEach((doc) => fetchedExams.push(doc.data())); appState.exams = fetchedExams; app.filterExams();
                }, (error) => { console.error("Error loading exams:", error); ui.showToast('تعذر الاتصال بالخادم.', 'error'); });
            },
            loadStudentStats: async () => {
                try {
                    const q = query(collection(db, "results"), where("userId", "==", appState.user.uid)); const querySnapshot = await getDocs(q); 
                    let totalPercentage = 0; let count = 0; appState.studentStats.completedIds = [];
                    querySnapshot.forEach((doc) => { const r = doc.data(); count++; totalPercentage += r.percentage || 0; if (r.examId) appState.studentStats.completedIds.push(r.examId); });
                    if (count > 0) { appState.studentStats.totalCompleted = count; appState.studentStats.averageScore = Math.round(totalPercentage / count); document.getElementById('stat-completed-exams').innerText = count; document.getElementById('stat-average-score').innerText = `${appState.studentStats.averageScore}%`; }
                } catch (error) { console.error("Error loading stats:", error); }
            },
            renderExamsList: (exams) => {
                const container = document.getElementById('exams-container');
                if (exams.length === 0) { container.innerHTML = `<div class="col-span-full ios-card text-center py-16 sm:py-20 text-ios-gray border border-dashed border-[var(--border-color)]"><ion-icon name="sad-outline" class="text-5xl sm:text-6xl mb-3 sm:mb-4 opacity-40"></ion-icon><h3 class="text-xl sm:text-2xl font-bold mb-2">لا توجد امتحانات</h3><p class="text-sm sm:text-base">لا توجد تحديات متاحة حالياً.</p></div>`; return; }
                const fragment = document.createDocumentFragment();
                exams.forEach(ex => {
                    const isCompleted = appState.studentStats?.completedIds?.includes(ex.id);
                    const badgeHTML = isCompleted ? `<span class="text-[10px] sm:text-xs font-bold bg-green-500/10 text-ios-green px-2 sm:px-3 py-1 sm:py-1.5 rounded-lg sm:rounded-xl border border-green-500/20 whitespace-nowrap flex items-center gap-1"><ion-icon name="checkmark-done"></ion-icon> مكتمل</span>` : `<span class="text-[10px] sm:text-xs font-bold bg-blue-500/10 text-ios-blue px-2 sm:px-3 py-1 sm:py-1.5 rounded-lg sm:rounded-xl border border-blue-500/20 whitespace-nowrap">${ex.questions.length} سؤال</span>`;
                    const el = document.createElement('div');
                    el.className = "ios-card p-0 overflow-hidden group cursor-pointer hover:-translate-y-1 sm:hover:-translate-y-2 transition-all duration-500 animate-slide-up flex flex-col h-full";
                    el.onclick = () => app.startExam(ex.id);
                    el.innerHTML = `
                        ${ex.coverImage ? `<div class="h-32 sm:h-40 w-full overflow-hidden relative">${isCompleted ? `<div class="absolute inset-0 bg-ios-green/10 z-10 pointer-events-none backdrop-blur-[2px]"></div>` : ''}<img src="${ex.coverImage}" class="w-full h-full object-cover group-hover:scale-105 transition duration-700" loading="lazy"/></div>` : `<div class="h-32 sm:h-40 w-full bg-gradient-to-br from-[var(--input-bg)] to-transparent flex items-center justify-center text-ios-blue/40"><ion-icon name="color-palette" class="text-4xl sm:text-5xl"></ion-icon></div>`}
                        <div class="p-5 sm:p-6 flex flex-col flex-1">
                            <div class="flex justify-between items-start mb-2 sm:mb-3 gap-2 sm:gap-3"><h3 class="text-lg sm:text-2xl font-bold text-ios-text line-clamp-2 tracking-tight leading-tight">${ex.title}</h3>${badgeHTML}</div>
                            <p class="text-ios-gray text-xs sm:text-base mb-4 sm:mb-6 line-clamp-2 leading-relaxed flex-1">${ex.desc}</p>
                            <button class="w-full ${isCompleted ? 'bg-green-500/10 text-ios-green group-hover:bg-ios-green' : 'bg-[var(--input-bg)] text-ios-text group-hover:bg-ios-text group-hover:text-[var(--bg-color)]'} font-bold py-3 sm:py-4 rounded-xl sm:rounded-2xl flex items-center justify-center gap-1.5 sm:gap-2 text-sm sm:text-base transition-all duration-300">${isCompleted ? 'إعادة التحدي' : 'بدء التحدي'} <ion-icon name="arrow-back"></ion-icon></button>
                        </div>`;
                    fragment.appendChild(el);
                });
                container.innerHTML = ''; container.appendChild(fragment);
            },
            filterExams: () => { clearTimeout(appState.searchTimeout); appState.searchTimeout = setTimeout(() => { const term = document.getElementById('search-exam').value.toLowerCase(); const filtered = appState.exams.filter(ex => ex.title.toLowerCase().includes(term) || (ex.desc && ex.desc.toLowerCase().includes(term))); app.renderExamsList(filtered); }, 300); },
            
            startExam: (id) => { 
                const exam = appState.exams.find(e => e.id === id); 
                if (!exam || !exam.questions || exam.questions.length === 0) { ui.showToast('هذا الامتحان فارغ', 'error'); return; } 
                let questions = [...exam.questions]; if (exam.randomize) questions.sort(() => Math.random() - 0.5); 
                appState.currentExam = { ...exam, questions }; 
                appState.playerState = { questionIndex: 0, score: 0, correct: 0, wrong: 0, timer: null, seconds: exam.timeLimit ? exam.timeLimit * 60 : 0, answers: {} }; 
                
                ui.switchView('view-exam-player'); 
                if (exam.timeLimit) { document.getElementById('timer-display').classList.remove('hidden'); app.startTimer(); } else { document.getElementById('timer-display').classList.add('hidden'); } 
                app.renderQuestion(); 
            },
            exitExam: () => { ui.confirm('تأكيد الخروج', 'هل أنت متأكد من الخروج؟ سيتم فقدان تقدمك.', () => { clearInterval(appState.playerState.timer); ui.switchView('view-student-dashboard'); }); },
            startTimer: () => { const display = document.getElementById('time-left'); const updateDisplay = () => { const s = appState.playerState.seconds; const m = Math.floor(s / 60); const remS = s % 60; display.innerText = `${m.toString().padStart(2, '0')}:${remS.toString().padStart(2, '0')}`; if (s <= 60) display.classList.add('text-ios-red'); else display.classList.remove('text-ios-red'); }; updateDisplay(); appState.playerState.timer = setInterval(() => { appState.playerState.seconds--; updateDisplay(); if (appState.playerState.seconds <= 0) { clearInterval(appState.playerState.timer); ui.showToast('انتهى الوقت!', 'error'); app.finishExam(); } }, 1000); },
            
            renderQuestion: () => {
                const state = appState.playerState; const exam = appState.currentExam; const q = exam.questions[state.questionIndex]; 
                const progressPct = ((state.questionIndex) / exam.questions.length) * 100; 
                document.getElementById('player-progress-bar').style.width = `${progressPct}%`; 
                document.getElementById('player-progress-text').innerText = `السؤال ${state.questionIndex + 1} من ${exam.questions.length}`; 
                
                const qContainer = document.getElementById('question-anim-container');
                qContainer.classList.remove('animate-scale-in', 'animate-fade-in');
                void qContainer.offsetWidth;
                qContainer.classList.add('animate-fade-in');

                document.getElementById('question-text').innerText = q.text;
                const optBox = document.getElementById('options-container'); const essayBox = document.getElementById('essay-container'); const fbBox = document.getElementById('feedback-container');
                optBox.innerHTML = ''; fbBox.classList.add('hidden');

                const answeredVal = state.answers[state.questionIndex];

                if (q.type === 'mcq') { 
                    essayBox.classList.add('hidden'); optBox.classList.remove('hidden'); 
                    q.options.forEach((opt, idx) => { 
                        const btn = document.createElement('button'); 
                        btn.className = `ios-option w-full p-4 sm:p-5 text-right flex items-center justify-between group animate-slide-up stagger-${idx+1}`; 
                        btn.innerHTML = `<span class="text-base sm:text-xl font-bold leading-relaxed pr-2">${opt.text}</span><div class="w-6 h-6 sm:w-8 sm:h-8 rounded-full border-2 border-[var(--text-muted)] flex items-center justify-center transition-colors group-hover:border-ios-blue shrink-0"></div>`; 
                        
                        if (answeredVal !== undefined) {
                            btn.disabled = true; btn.classList.add('opacity-90', 'cursor-default'); btn.classList.remove('hover:-translate-y-2');
                            if (idx === q.correctIndex) {
                                btn.classList.add('correct');
                                btn.innerHTML = btn.innerHTML.replace('border-[var(--text-muted)]', 'bg-transparent border-transparent').replace('</div>', '<ion-icon name="checkmark-circle" class="text-ios-green font-bold text-2xl sm:text-3xl"></ion-icon></div>');
                            } else if (idx === answeredVal) {
                                btn.classList.add('wrong');
                                btn.innerHTML = btn.innerHTML.replace('border-[var(--text-muted)]', 'bg-transparent border-transparent').replace('</div>', '<ion-icon name="close-circle" class="text-ios-red font-bold text-2xl sm:text-3xl"></ion-icon></div>');
                            }
                        } else {
                            btn.onclick = () => app.handleAnswer(idx); 
                        }
                        optBox.appendChild(btn); 
                    }); 
                }
                else if (q.type === 'tf') { 
                    essayBox.classList.add('hidden'); optBox.classList.remove('hidden'); 
                    const createTF = (text, val, idx) => { 
                        const btn = document.createElement('button'); 
                        btn.className = `ios-option w-full p-4 sm:p-6 text-center group animate-slide-up stagger-${idx+1}`; 
                        btn.innerHTML = `<span class="text-xl sm:text-2xl font-black">${text}</span>`; 
                        
                        if (answeredVal !== undefined) {
                            btn.disabled = true; btn.classList.add('opacity-90', 'cursor-default'); btn.classList.remove('hover:-translate-y-2');
                            if (val === q.isTrue) btn.classList.add('correct');
                            else if (val === answeredVal) btn.classList.add('wrong');
                        } else {
                            btn.onclick = () => app.handleAnswer(val); 
                        }
                        optBox.appendChild(btn); 
                    }; 
                    createTF('صح', true, 1); createTF('خطأ', false, 2); 
                }
                else if (q.type === 'essay') { 
                    optBox.classList.add('hidden'); essayBox.classList.remove('hidden'); 
                    const textArea = document.getElementById('essay-answer');
                    const submitBtn = document.getElementById('essay-submit-btn');
                    if(answeredVal !== undefined) {
                        textArea.value = answeredVal; textArea.disabled = true; submitBtn.classList.add('hidden');
                    } else {
                        textArea.value = ''; textArea.disabled = false; submitBtn.classList.remove('hidden');
                    }
                }

                const btnPrev = document.getElementById('btn-prev');
                const btnNext = document.getElementById('btn-next');
                
                if (state.questionIndex === 0) { btnPrev.disabled = true; } else { btnPrev.disabled = false; }
                
                if (state.questionIndex === exam.questions.length - 1) {
                    btnNext.innerHTML = 'إنهاء التحدي <ion-icon name="checkmark-done"></ion-icon>';
                    btnNext.className = 'ios-btn bg-ios-green text-white py-3.5 sm:py-4 px-4 sm:px-12 text-sm sm:text-lg shadow-lg shadow-green-500/30 flex-1 sm:flex-none gap-1.5 sm:gap-2 transition-all hover:scale-[0.98]';
                    btnNext.onclick = () => app.finishExam();
                } else {
                    btnNext.innerHTML = 'التالي <ion-icon name="arrow-back"></ion-icon>';
                    btnNext.className = 'ios-btn bg-ios-blue text-white py-3.5 sm:py-4 px-4 sm:px-12 text-sm sm:text-lg shadow-lg shadow-blue-500/30 flex-1 sm:flex-none gap-1.5 sm:gap-2 transition-all hover:scale-[0.98]';
                    btnNext.onclick = () => app.nextQuestion();
                }

                if (answeredVal !== undefined) {
                    const isCorrect = q.type === 'essay' ? true : (q.type === 'mcq' ? answeredVal === q.correctIndex : answeredVal === q.isTrue);
                    app.showFeedback(isCorrect, q, answeredVal, false);
                }
            },
            handleAnswer: (selectedVal) => {
                const state = appState.playerState; const q = appState.currentExam.questions[state.questionIndex]; 
                if (state.answers[state.questionIndex] !== undefined) return; 

                state.answers[state.questionIndex] = selectedVal; 

                const btns = document.getElementById('options-container').querySelectorAll('.ios-option');
                btns.forEach(b => { b.disabled = true; b.classList.add('opacity-90', 'cursor-default'); b.classList.remove('hover:-translate-y-2'); });
                
                let isCorrect = false;
                if (q.type === 'mcq') { 
                    isCorrect = (selectedVal === q.correctIndex); 
                    btns[q.correctIndex].classList.add('correct'); 
                    btns[q.correctIndex].innerHTML = btns[q.correctIndex].innerHTML.replace('border-[var(--text-muted)]', 'bg-transparent border-transparent').replace('</div>', '<ion-icon name="checkmark-circle" class="text-ios-green font-bold text-2xl sm:text-3xl"></ion-icon></div>'); 
                    if (isCorrect) btns[q.correctIndex].classList.add('animate-dynamic-pop'); 
                    if (!isCorrect) { 
                        btns[selectedVal].classList.add('wrong'); 
                        btns[selectedVal].innerHTML = btns[selectedVal].innerHTML.replace('border-[var(--text-muted)]', 'bg-transparent border-transparent').replace('</div>', '<ion-icon name="close-circle" class="text-ios-red font-bold text-2xl sm:text-3xl"></ion-icon></div>'); 
                    } 
                }
                else if (q.type === 'tf') { 
                    isCorrect = (selectedVal === q.isTrue); const correctBtnIndex = q.isTrue ? 0 : 1; const selectedBtnIndex = selectedVal ? 0 : 1; 
                    btns[correctBtnIndex].classList.add('correct'); if (isCorrect) btns[correctBtnIndex].classList.add('animate-dynamic-pop'); 
                    if (!isCorrect) { btns[selectedBtnIndex].classList.add('wrong'); } 
                }
                
                if (isCorrect) { state.score++; state.correct++; ui.playSound('correct'); } else { state.wrong++; ui.playSound('wrong'); } 
                app.showFeedback(isCorrect, q, selectedVal, true);
            },
            submitEssay: () => { 
                const state = appState.playerState; if(state.answers[state.questionIndex] !== undefined) return;
                const text = document.getElementById('essay-answer').value.trim(); 
                if (!text) { ui.showToast('يرجى كتابة إجابة أولاً', 'error'); return; } 
                state.answers[state.questionIndex] = text; state.score++; state.correct++;
                document.getElementById('essay-submit-btn').classList.add('hidden'); document.getElementById('essay-answer').disabled = true;
                app.showFeedback(true, appState.currentExam.questions[state.questionIndex], text, true); 
            },
            showFeedback: (isCorrect, q, selectedVal, autoScroll = false) => {
                const fbBox = document.getElementById('feedback-container'); const fbCard = document.getElementById('feedback-card'); const icon = document.getElementById('feedback-icon'); const title = document.getElementById('feedback-title'); const desc = document.getElementById('feedback-desc'); const analysis = document.getElementById('feedback-options-analysis');
                fbBox.classList.remove('hidden'); analysis.classList.add('hidden'); analysis.innerHTML = ''; fbCard.className = 'ios-card border-2 p-5 sm:p-8 flex flex-col sm:flex-row items-start gap-4 sm:gap-5 transition-colors duration-300 ';
                
                if (q.type === 'essay') { 
                    fbCard.classList.add('border-ios-purple', 'bg-purple-500/5'); icon.innerHTML = '<ion-icon name="bulb" class="text-ios-purple"></ion-icon>'; 
                    title.innerText = 'الإجابة النموذجية'; title.className = 'text-lg sm:text-2xl font-black mb-2 sm:mb-3 text-ios-purple'; 
                    desc.innerHTML = `<div class="font-bold text-ios-text bg-[var(--card-bg)] p-4 sm:p-5 rounded-xl sm:rounded-2xl shadow-sm border border-[var(--border-color)] text-sm sm:text-base">${q.modelAnswer}</div>`; 
                    if (q.explanation) desc.innerHTML += `<div class="mt-4 sm:mt-5 text-xs sm:text-sm text-ios-gray flex gap-1.5 sm:gap-2"><ion-icon name="information-circle" class="text-lg sm:text-xl"></ion-icon> ${q.explanation}</div>`; 
                }
                else { 
                    if (isCorrect) { fbCard.classList.add('border-ios-green', 'bg-green-500/5'); icon.innerHTML = '<ion-icon name="checkmark-circle" class="text-ios-green"></ion-icon>'; title.innerText = 'إجابة صحيحة!'; title.className = 'text-lg sm:text-2xl font-black mb-2 sm:mb-3 text-ios-green'; } 
                    else { fbCard.classList.add('border-ios-red', 'bg-red-500/5'); icon.innerHTML = '<ion-icon name="close-circle" class="text-ios-red"></ion-icon>'; title.innerText = 'إجابة خاطئة'; title.className = 'text-lg sm:text-2xl font-black mb-2 sm:mb-3 text-ios-red'; } 
                    desc.innerText = q.explanation || 'لا يوجد تفسير إضافي.'; 
                    if (q.type === 'mcq') { 
                        analysis.classList.remove('hidden'); 
                        q.options.forEach((opt, idx) => { 
                            if (opt.explanation) { 
                                let indicator = (idx === q.correctIndex) ? '<ion-icon name="checkmark-circle" class="text-ios-green ml-1 sm:ml-2 text-base sm:text-lg"></ion-icon>' : ((idx === selectedVal && !isCorrect) ? '<ion-icon name="close-circle" class="text-ios-red ml-1 sm:ml-2 text-base sm:text-lg"></ion-icon>' : ''); 
                                analysis.innerHTML += `<div class="bg-[var(--card-bg)] p-3 sm:p-4 rounded-xl sm:rounded-2xl border border-[var(--border-color)] text-xs sm:text-base"><div class="font-bold flex items-center mb-1 text-ios-text">${indicator} ${opt.text}</div><div class="text-ios-gray pr-5 sm:pr-7">${opt.explanation}</div></div>`; 
                            } 
                        }); 
                    } 
                }
                
                const srcHtml = [ q.sourceQuestion ? `<div class="flex items-center gap-2 sm:gap-3 text-xs sm:text-sm bg-[var(--input-bg)] p-2.5 sm:p-3 rounded-lg sm:rounded-xl"><span class="shrink-0 w-6 h-6 sm:w-8 sm:h-8 bg-amber-500/20 text-amber-500 rounded-full flex items-center justify-center"><ion-icon name="location" class="text-sm sm:text-lg"></ion-icon></span><div><span class="font-bold text-ios-text block">السؤال: </span><span class="text-ios-gray">${q.sourceQuestion}</span></div></div>` : '', q.sourceAnswer ? `<div class="flex items-center gap-2 sm:gap-3 text-xs sm:text-sm bg-[var(--input-bg)] p-2.5 sm:p-3 rounded-lg sm:rounded-xl"><span class="shrink-0 w-6 h-6 sm:w-8 sm:h-8 bg-green-500/20 text-ios-green rounded-full flex items-center justify-center"><ion-icon name="checkmark-done" class="text-sm sm:text-lg"></ion-icon></span><div><span class="font-bold text-ios-text block">الإجابة: </span><span class="text-ios-gray">${q.sourceAnswer}</span></div></div>` : '' ].filter(Boolean).join('');
                const oldSrc = fbCard.querySelector('.source-refs'); if (oldSrc) oldSrc.remove();
                if (srcHtml) { const srcEl = document.createElement('div'); srcEl.className = 'source-refs mx-3 sm:mx-8 mb-4 sm:mb-6 mt-3 sm:mt-4 space-y-2 sm:space-y-3'; srcEl.innerHTML = `<p class="text-[10px] sm:text-xs font-black text-ios-gray uppercase tracking-widest mb-2 sm:mb-3 flex items-center gap-1.5 sm:gap-2"><ion-icon name="book"></ion-icon> المراجع العلمية</p><div class="grid grid-cols-1 sm:grid-cols-2 gap-2 sm:gap-3">${srcHtml}</div>`; fbCard.appendChild(srcEl); }
                
                if(autoScroll) { setTimeout(() => fbBox.scrollIntoView({ behavior: 'smooth', block: 'center' }), 100); }
            },
            nextQuestion: () => { 
                appState.playerState.questionIndex++; 
                app.renderQuestion(); 
            },
            prevQuestion: () => { 
                if(appState.playerState.questionIndex > 0) {
                    appState.playerState.questionIndex--; 
                    app.renderQuestion();
                }
            },
            finishExam: async () => {
                clearInterval(appState.playerState.timer); const state = appState.playerState; 
                const totalQs = appState.currentExam.questions.filter(q => q.type !== 'essay').length; 
                
                const actualWrongOrMissed = totalQs > 0 ? (totalQs - state.correct) : 0;
                let pct = totalQs > 0 ? Math.round((state.score / totalQs) * 100) : 100;
                
                document.getElementById('result-score').innerText = `${pct}%`; 
                document.getElementById('result-correct').innerText = state.correct; 
                document.getElementById('result-wrong').innerText = actualWrongOrMissed;
                
                const msgEl = document.getElementById('result-message'); 
                if (pct >= 90) msgEl.innerText = "أداء استثنائي! أنت عبقري."; else if (pct >= 75) msgEl.innerText = "أداء ممتاز! استمر."; else if (pct >= 50) msgEl.innerText = "عمل جيد، يمكنك تقديم الأفضل."; else msgEl.innerText = "لا تستسلم! المحاولة القادمة أفضل.";
                
                ui.switchView('view-exam-results');
                const resultId = 'res_' + Date.now() + Math.random().toString(36).substr(2, 5);
                const payload = { id: resultId, userId: appState.user.uid, userName: appState.user.name, examId: appState.currentExam.id, examTitle: appState.currentExam.title, score: state.score, correct: state.correct, wrong: actualWrongOrMissed, percentage: pct, completedAt: Date.now() };
                try { const localKey = `noor_results_${appState.user.uid}`; const existing = JSON.parse(localStorage.getItem(localKey) || '[]'); existing.unshift(payload); localStorage.setItem(localKey, JSON.stringify(existing)); } catch(le) {}
                try { await setDoc(doc(db, "results", resultId), payload); app.loadStudentStats(); } catch (error) {}
            },
            renderNotificationsList: () => {
                const list = document.getElementById('notif-list');
                if (appState.notifications.length === 0) { list.innerHTML = '<div class="text-center p-8 sm:p-10 text-ios-gray font-bold text-base sm:text-lg">لا توجد إشعارات حالياً.</div>'; return; }
                list.innerHTML = appState.notifications.map(n => `
                    <div class="bg-[var(--card-bg)] p-4 sm:p-5 rounded-2xl sm:rounded-3xl shadow-sm border border-[var(--border-color)] flex gap-3 sm:gap-4 hover:bg-[var(--input-bg)] transition-colors">
                        <div class="w-10 h-10 sm:w-12 sm:h-12 bg-blue-500/10 text-ios-blue rounded-xl sm:rounded-2xl flex items-center justify-center shrink-0 mt-1"><ion-icon name="mail" class="text-xl sm:text-2xl"></ion-icon></div>
                        <div><h4 class="font-bold text-ios-text text-lg sm:text-xl mb-1">${n.title}</h4><p class="text-sm sm:text-base text-ios-gray leading-relaxed">${n.body}</p><span class="text-[10px] sm:text-xs text-ios-gray/60 mt-2 sm:mt-3 block font-mono" dir="ltr">${new Date(n.createdAt).toLocaleString('ar-EG')}</span></div>
                    </div>
                `).join('');
            }
        };

        window.addEventListener('DOMContentLoaded', app.init);
    </script>
</body>
</html>
